<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Game 😄</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
      color: white;
      touch-action: manipulation;
    }

    /* MAIN GAME SCREEN - always visible */
    #gameArea {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      padding: 10px 15px;
    }
    #gameArea.active { display: flex; }

    #progress {
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      opacity: 0.8;
      margin-bottom: 10px;
    }

    h1#question {
      text-align: center;
      font-size: clamp(2.2rem, 7vw, 5rem);
      margin: 0 0 20px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
      line-height: 1.15;
      padding: 0 10px;
      word-break: break-word;
      white-space: normal;
    }

    #homeMessage {
      text-align: center;
      margin-top: 25vh;
      padding: 0 30px;
    }
    #homeMessage h2 {
      font-size: 3rem;
      text-shadow: 0 4px 10px rgba(0,0,0,0.4);
      margin-bottom: 10px;
    }
    #homeMessage p {
      font-size: 1.4rem;
      opacity: 0.8;
    }

    .poll-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .option {
      font-size: clamp(1.8rem, 6vw, 3.5rem);
      padding: clamp(16px, 4vw, 30px) clamp(30px, 8vw, 70px);
      border-radius: 60px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      position: relative;
      white-space: nowrap;
      max-width: 85vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #correct {
      background: #ff2d55;
      z-index: 10;
      transform: scale(1);
      transition: all 0.25s ease-out;
    }

    #wrong {
      background: #00ff9d;
      color: black;
      z-index: 5;
    }


    /* Bottom nav buttons - always visible on home */
    .home-buttons {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 50;
    }
    .home-btn {
      font-size: 1.4rem;
      padding: 16px 36px;
      border-radius: 50px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }
    .home-btn:active { transform: scale(0.95); }
    #playBtn {
      background: #00ff9d;
      color: black;
    }
    #manageBtn {
      background: rgba(255,255,255,0.2);
      color: white;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.4);
    }

    /* QUESTION MANAGER OVERLAY */
    #manager {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    #manager.open { display: flex; }

    .setup-header {
      text-align: center;
      padding: 24px 20px 12px;
      flex-shrink: 0;
    }
    .setup-header h2 {
      font-size: 2rem;
      margin: 0 0 6px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .setup-header p {
      opacity: 0.8;
      margin: 0;
      font-size: 1rem;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 540px;
      padding: 8px 20px 120px;
    }

    .q-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border-left: 5px solid rgba(255,255,255,0.3);
      animation: cardIn 0.3s ease-out;
      position: relative;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .q-card .card-num {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-bottom: 8px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .q-card input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      font-size: 1rem;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.9);
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }
    .q-card input:focus {
      border-color: #a78bfa;
    }
    .q-card input.correct-input {
      border-left: 4px solid #00c853;
    }
    .q-card input.wrong-input {
      border-left: 4px solid #ff2d55;
    }

    .q-card .row {
      display: flex;
      gap: 8px;
    }
    .q-card .row input { flex: 1; margin-bottom: 0; }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .delete-btn:hover { background: rgba(255,60,80,0.6); }

    .add-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2px dashed rgba(255,255,255,0.4);
      background: transparent;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-btn:hover { background: rgba(255,255,255,0.1); }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30,20,60,0.85);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 101;
    }
    .bottom-bar .q-count {
      font-size: 1rem;
      opacity: 0.8;
    }
    .bottom-bar button {
      font-size: 1.3rem;
      padding: 12px 36px;
      border-radius: 50px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .bottom-bar button:active { transform: scale(0.95); }
    #saveBtn {
      background: #00ff9d;
      color: black;
      box-shadow: 0 4px 15px rgba(0,255,157,0.3);
    }
    #closeManagerBtn {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* Win screen */
    #winScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #00c853, #00e676);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    #winScreen h2 {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    #winScreen p {
      font-size: 1.6rem;
      opacity: 0.9;
    }

    #playAgainBtn {
      margin-top: 30px;
      font-size: 1.6rem;
      padding: 15px 50px;
      border-radius: 50px;
      border: none;
      background: white;
      color: #00c853;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- MAIN GAME SCREEN (always visible) -->
  <div id="homeMessage">
    <h2>Quiz Game 🎮</h2>
    <p>Tap the correct answer to win!</p>
  </div>

  <div id="gameArea">
    <div id="progress"></div>
    <h1 id="question"></h1>
    <div class="poll-container" id="pollContainer">
      <div id="correct" class="option"></div>
      <div id="wrong" class="option"></div>
    </div>
  </div>

  <div class="home-buttons" id="homeButtons">
    <button class="home-btn" id="playBtn">Play 🎮</button>
    <button class="home-btn" id="manageBtn">Questions ✏️</button>
  </div>

  <!-- QUESTION MANAGER OVERLAY -->
  <div id="manager">
    <div class="setup-header">
      <h2>Manage Questions 📝</h2>
      <p>Add, edit, or delete questions for your quiz!</p>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="bottom-bar">
      <span class="q-count" id="qCount">5 questions</span>
      <button id="closeManagerBtn">Cancel</button>
      <button id="saveBtn">Save & Close ✓</button>
    </div>
  </div>

  <!-- WIN SCREEN -->
  <div id="winScreen">
    <h2>🎉 You Win! 🎉</h2>
    <p id="winMessage"></p>
    <button id="playAgainBtn">Play Again 🔄</button>
  </div>

  <script>
    const defaultQuestions = [
      { question: "What color is the sky?", correct: "Blue", wrong: "Pink 🩷" },
      { question: "2 + 2 = ?", correct: "4", wrong: "22 😂" },
      { question: "Which animal says 'Meow'?", correct: "Cat 🐱", wrong: "Cow 🐮" },
      { question: "How many legs does a spider have?", correct: "8", wrong: "100 🤪" },
      { question: "What do fish live in?", correct: "Water 💧", wrong: "Pizza 🍕" },
    ];

    const saved = localStorage.getItem('quizQuestions');
    let questions = saved ? JSON.parse(saved) : [...defaultQuestions];
    let currentIndex = 0;
    let taps = 0;
    let correctSize = 1;
    let wrongSize = 1;
    let playing = false;

    const homeMessage = document.getElementById('homeMessage');
    const gameArea = document.getElementById('gameArea');
    const questionEl = document.getElementById('question');
    const progressEl = document.getElementById('progress');
    const pollContainer = document.getElementById('pollContainer');
    const correctBtn = document.getElementById('correct');
    const wrongBtn = document.getElementById('wrong');

    const homeButtons = document.getElementById('homeButtons');
    const playBtn = document.getElementById('playBtn');
    const manageBtn = document.getElementById('manageBtn');
    const manager = document.getElementById('manager');
    const cardList = document.getElementById('cardList');
    const qCount = document.getElementById('qCount');
    const saveBtn = document.getElementById('saveBtn');
    const closeManagerBtn = document.getElementById('closeManagerBtn');
    const winScreen = document.getElementById('winScreen');
    const winMessage = document.getElementById('winMessage');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // --- Card Manager ---
    function createCard(q, index) {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `
        <div class="card-num">Question ${index + 1}</div>
        <button class="delete-btn" title="Delete">🗑</button>
        <input type="text" class="question-input" placeholder="Question..." value="${escapeHtml(q.question)}">
        <div class="row">
          <input type="text" class="correct-input" placeholder="✓ Correct" value="${escapeHtml(q.correct)}">
          <input type="text" class="wrong-input" placeholder="✗ Wrong" value="${escapeHtml(q.wrong)}">
        </div>
      `;
      card.querySelector('.delete-btn').addEventListener('click', () => {
        card.style.transition = 'opacity 0.2s, transform 0.2s';
        card.style.opacity = '0';
        card.style.transform = 'translateX(-30px)';
        setTimeout(() => { card.remove(); renumberCards(); }, 200);
      });
      return card;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renumberCards() {
      const cards = cardList.querySelectorAll('.q-card');
      cards.forEach((c, i) => {
        c.querySelector('.card-num').textContent = `Question ${i + 1}`;
      });
      updateCount();
    }

    function updateCount() {
      const n = cardList.querySelectorAll('.q-card').length;
      qCount.textContent = `${n} question${n !== 1 ? 's' : ''}`;
    }

    // Build the add button (lives inside card list)
    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = '+ Add Question';
    addBtn.addEventListener('click', () => {
      const index = cardList.querySelectorAll('.q-card').length;
      const card = createCard({ question: '', correct: '', wrong: '' }, index);
      cardList.insertBefore(card, addBtn);
      updateCount();
      card.querySelector('.question-input').focus();
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    cardList.appendChild(addBtn);

    function populateCards(qs) {
      // Remove existing cards but keep add button
      cardList.querySelectorAll('.q-card').forEach(c => c.remove());
      qs.forEach((q, i) => {
        const card = createCard(q, i);
        cardList.insertBefore(card, addBtn);
      });
      updateCount();
    }

    function collectQuestions() {
      const cards = cardList.querySelectorAll('.q-card');
      const qs = [];
      cards.forEach(card => {
        const q = card.querySelector('.question-input').value.trim();
        const c = card.querySelector('.correct-input').value.trim();
        const w = card.querySelector('.wrong-input').value.trim();
        if (q && c && w) qs.push({ question: q, correct: c, wrong: w });
      });
      return qs;
    }

    // --- Manager open/close ---
    function openManager() {
      populateCards(questions);
      manager.classList.add('open');
    }

    function closeManager() {
      manager.classList.remove('open');
    }

    manageBtn.addEventListener('click', openManager);

    closeManagerBtn.addEventListener('click', closeManager);

    saveBtn.addEventListener('click', () => {
      const qs = collectQuestions();
      if (qs.length === 0) {
        alert('Please add at least one complete question!');
        return;
      }
      questions = qs;
      localStorage.setItem('quizQuestions', JSON.stringify(questions));
      closeManager();
    });

    // --- Game ---
    function startGame() {
      if (questions.length === 0) {
        alert('No questions! Tap "Questions" to add some.');
        return;
      }
      playing = true;
      currentIndex = 0;
      taps = 0;
      correctSize = 1;
      homeMessage.style.display = 'none';
      homeButtons.style.display = 'none';
      gameArea.classList.add('active');
      winScreen.style.display = 'none';
      loadQuestion();
    }

    function endGame() {
      playing = false;
      gameArea.classList.remove('active');
      homeMessage.style.display = 'block';
      homeButtons.style.display = 'flex';
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      questionEl.textContent = q.question;
      progressEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      correctBtn.textContent = q.correct;
      wrongBtn.textContent = q.wrong;
      correctSize = 1;
      wrongSize = 1;
      correctBtn.style.transform = 'scale(1)';
      wrongBtn.style.transform = 'scale(1)';

      correctBtn.style.position = 'relative';
      correctBtn.style.left = '';
      correctBtn.style.top = '';
      wrongBtn.style.position = 'relative';
      wrongBtn.style.left = '';
      wrongBtn.style.top = '';
      wrongBtn.style.transform = 'scale(1)';
    }

    function getRandomPosition() {
      const maxX = window.innerWidth - 280;
      const maxY = window.innerHeight - 200;
      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(80, Math.random() * maxY);
      return { x, y };
    }

    // Correct button RUNS AWAY - kids can't click it!
    correctBtn.addEventListener('click', () => {
      if (!playing) return;
      taps++;

      wrongSize += 0.6;
      correctSize = Math.max(0.1, correctSize - 0.6);
      wrongBtn.style.transform = `scale(${wrongSize})`;
      const pos = getRandomPosition();
      correctBtn.style.position = 'fixed';
      correctBtn.style.left = pos.x + 'px';
      correctBtn.style.top = pos.y + 'px';
      correctBtn.style.transform = `scale(${correctSize * 1.2})`;
      setTimeout(() => { correctBtn.style.transform = `scale(${correctSize})`; }, 120);
    });

    // Wrong button advances - kids are forced to pick this!
    wrongBtn.addEventListener('click', () => {
      if (!playing) return;
      currentIndex++;
      if (currentIndex >= questions.length) {
        winMessage.textContent = `You finished all ${questions.length} questions!`;
        winScreen.style.display = 'flex';
        playing = false;
        gameArea.classList.remove('active');
      } else {
        loadQuestion();
      }
    });

    playBtn.addEventListener('click', startGame);

    playAgainBtn.addEventListener('click', () => {
      winScreen.style.display = 'none';
      homeMessage.style.display = 'block';
      homeButtons.style.display = 'flex';
    });
  </script>

</body>
</html>
