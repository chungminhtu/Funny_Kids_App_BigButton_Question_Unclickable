<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Game 😄</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
      color: white;
      touch-action: manipulation;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin: 30px 20px 5px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #progress {
      text-align: center;
      font-size: 1.2rem;
      opacity: 0.8;
      margin: 5px 0 0;
    }

    .poll-container {
      position: relative;
      height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .option {
      font-size: 2.2rem;
      padding: 22px 60px;
      border-radius: 60px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      position: absolute;
      white-space: nowrap;
      max-width: 80vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #correct {
      background: #00ff9d;
      color: black;
      z-index: 10;
      transform: scale(1);
    }

    #wrong {
      background: #ff2d55;
      z-index: 5;
      transition: all 0.25s ease-out;
    }

    #counter {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.4rem;
      background: rgba(0,0,0,0.5);
      padding: 10px 25px;
      border-radius: 50px;
    }

    /* Setup screen */
    #setup {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      overflow-y: auto;
    }

    #setup h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    #setup p {
      opacity: 0.8;
      margin: 0 0 20px;
      text-align: center;
      max-width: 500px;
    }

    #setup textarea {
      width: min(90vw, 500px);
      height: 40vh;
      font-size: 1.1rem;
      padding: 15px;
      border-radius: 15px;
      border: none;
      font-family: monospace;
      resize: vertical;
    }

    #startBtn {
      margin-top: 20px;
      font-size: 1.6rem;
      padding: 15px 50px;
      border-radius: 50px;
      border: none;
      background: #00ff9d;
      color: black;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    #useDefaultBtn {
      margin-top: 12px;
      font-size: 1.2rem;
      padding: 10px 30px;
      border-radius: 50px;
      border: 2px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    /* Win screen */
    #winScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #00c853, #00e676);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    #winScreen h2 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    #winScreen p {
      font-size: 1.5rem;
      opacity: 0.9;
    }

    #playAgainBtn {
      margin-top: 30px;
      font-size: 1.6rem;
      padding: 15px 50px;
      border-radius: 50px;
      border: none;
      background: white;
      color: #00c853;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- SETUP SCREEN -->
  <div id="setup">
    <h2>Enter Your Questions 📝</h2>
    <p>One question per line. Format:<br><b>Question? | Correct Answer | Wrong Answer</b></p>
    <textarea id="questionInput" placeholder="Which is the best LLM? | Grok | Others
What color is the sky? | Blue | Green
2 + 2 = ? | 4 | 5
Capital of France? | Paris | London"></textarea>
    <button id="startBtn">Start Game 🎮</button>
    <button id="useDefaultBtn">Use Default Questions</button>
  </div>

  <!-- GAME SCREEN -->
  <h1 id="question"></h1>
  <div id="progress"></div>

  <div class="poll-container">
    <div id="correct" class="option"></div>
    <div id="wrong" class="option"></div>
  </div>

  <div id="counter">Taps: 0</div>

  <!-- WIN SCREEN -->
  <div id="winScreen">
    <h2>🎉 You Win! 🎉</h2>
    <p id="winMessage"></p>
    <button id="playAgainBtn">Play Again 🔄</button>
  </div>

  <script>
    const defaultQuestions = [
      { question: "Which is the best LLM in the world?", correct: "Grok", wrong: "Others" },
      { question: "What color is the sky?", correct: "Blue", wrong: "Green" },
      { question: "2 + 2 = ?", correct: "4", wrong: "5" },
      { question: "Which animal says 'Meow'?", correct: "Cat", wrong: "Dog" },
      { question: "How many legs does a spider have?", correct: "8", wrong: "6" },
    ];

    let questions = [];
    let currentIndex = 0;
    let taps = 0;
    let correctSize = 1;

    const setupEl = document.getElementById('setup');
    const questionInput = document.getElementById('questionInput');
    const startBtn = document.getElementById('startBtn');
    const useDefaultBtn = document.getElementById('useDefaultBtn');
    const questionEl = document.getElementById('question');
    const progressEl = document.getElementById('progress');
    const correctBtn = document.getElementById('correct');
    const wrongBtn = document.getElementById('wrong');
    const counterEl = document.getElementById('counter');
    const winScreen = document.getElementById('winScreen');
    const winMessage = document.getElementById('winMessage');
    const playAgainBtn = document.getElementById('playAgainBtn');

    function parseQuestions(text) {
      const lines = text.trim().split('\n').filter(l => l.trim());
      return lines.map(line => {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length >= 3) {
          return { question: parts[0], correct: parts[1], wrong: parts[2] };
        } else if (parts.length === 2) {
          return { question: parts[0], correct: parts[1], wrong: "Wrong!" };
        }
        return null;
      }).filter(Boolean);
    }

    function startGame(qs) {
      questions = qs;
      currentIndex = 0;
      taps = 0;
      correctSize = 1;
      counterEl.textContent = 'Taps: 0';
      setupEl.style.display = 'none';
      winScreen.style.display = 'none';
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      questionEl.textContent = q.question;
      progressEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      correctBtn.textContent = q.correct;
      wrongBtn.textContent = q.wrong;
      correctSize = 1;
      correctBtn.style.transform = 'scale(1)';

      // Reset positions
      correctBtn.style.left = '';
      correctBtn.style.top = '';
      wrongBtn.style.left = (window.innerWidth / 2 - 100) + 'px';
      wrongBtn.style.top = (window.innerHeight / 2 + 80) + 'px';
      wrongBtn.style.position = 'absolute';
    }

    function getRandomPosition() {
      const maxX = window.innerWidth - 280;
      const maxY = window.innerHeight - 200;
      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(80, Math.random() * maxY);
      return { x, y };
    }

    // Wrong button — runs away
    wrongBtn.addEventListener('click', () => {
      taps++;
      counterEl.textContent = `Taps: ${taps}`;

      correctSize += 0.28;
      correctBtn.style.transform = `scale(${correctSize})`;

      const pos = getRandomPosition();
      wrongBtn.style.left = pos.x + 'px';
      wrongBtn.style.top = pos.y + 'px';
      wrongBtn.style.position = 'absolute';

      wrongBtn.style.transform = 'scale(1.2)';
      setTimeout(() => {
        wrongBtn.style.transform = 'scale(1)';
      }, 120);
    });

    // Correct button — next question
    correctBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex >= questions.length) {
        // WIN!
        winMessage.textContent = `You answered all ${questions.length} questions with ${taps} wrong taps!`;
        winScreen.style.display = 'flex';
      } else {
        loadQuestion();
      }
    });

    startBtn.addEventListener('click', () => {
      const parsed = parseQuestions(questionInput.value);
      if (parsed.length === 0) {
        alert('Please enter at least one question in the format:\nQuestion? | Correct | Wrong');
        return;
      }
      startGame(parsed);
    });

    useDefaultBtn.addEventListener('click', () => {
      startGame(defaultQuestions);
    });

    playAgainBtn.addEventListener('click', () => {
      setupEl.style.display = 'flex';
      winScreen.style.display = 'none';
    });
  </script>

</body>
</html>
